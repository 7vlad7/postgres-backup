# Example stack. Remove `db` and `minio` to use your own Postgres and S3.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 2s
      retries: 30

  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  backup:
    build: .
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: appdb
      POSTGRES_HOST: db
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: backups
      S3_PREFIX: postgres
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      BACKUP_INTERVAL_MINUTES: "1"
      BACKUP_ENCRYPTION_PASSWORD: change-me-please
    restart: unless-stopped
